name: 網站測試

on:
  push:
    paths: ["web/**", ".github/workflows/web-test.yml"]
  pull_request:
    paths: ["web/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
